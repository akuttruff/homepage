version: 1
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  customHeaders:
    - pattern: '**/*.mp4'
      headers:
        - key: 'Content-Type'
          value: 'video/mp4'
    - pattern: '**/*.jpg'
      headers:
        - key: 'Content-Type'
          value: 'image/jpeg'
    - pattern: '**/*.png'
      headers:
        - key: 'Content-Type'
          value: 'image/png'
