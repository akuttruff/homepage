# Amplify Hosting custom headers. Hashed build assets and versioned fonts never change under the same name,
# so browsers may keep them for a year; index.html keeps Amplify's default (revalidate every visit).
# Apply with: aws amplify update-app --app-id "$AWS_AMPLIFY_APP_ID" --profile amplify-amie --custom-headers file://customHttp.yml
customHeaders:
  - pattern: '/static/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/fonts/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
